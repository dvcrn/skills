  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Build platform packages
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must be a stable semantic version such as 1.2.3 or v1.2.3"
            exit 1
          fi

          (cd npm && npm version "$VERSION" --no-git-tag-version --allow-same-version)
          node scripts/build_npm.mjs

      # Platform packages first: the wrapper pins them at this exact version.
      - name: Publish
        run: bash scripts/publish_npm.sh
