[tasks.link]
description = "Symlink all local skills into ~/.agents/skills and ~/.claude/skills"
run = '''
mkdir -p "$HOME/.agents/skills"
[ -d "$HOME/.claude" ] && mkdir -p "$HOME/.claude/skills"

for skill in */; do
  skill_name="${skill%/}"
  [[ "$skill_name" =~ ^\. ]] && continue
  [[ "$skill_name" == "plugins" ]] && continue
  
  ln -sfn "$PWD/$skill_name" "$HOME/.agents/skills/$skill_name"
  if [ -d "$HOME/.claude" ]; then
    ln -sfn "$PWD/$skill_name" "$HOME/.claude/skills/$skill_name"
  fi
done
echo "All local skills linked to ~/.agents/skills and ~/.claude/skills"
'''


[tasks.sync]
description = "Regenerate plugin manifests, marketplace.json, and the README skill list"
run = "node scripts/sync.mjs"

[tasks.sync-check]
description = "Fail if the generated plugin manifests, marketplace, or README are stale"
run = "node scripts/sync.mjs --check"
