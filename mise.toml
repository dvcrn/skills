[tasks.link]
description = "Symlink all local skills into ~/.agents/skills and ~/.claude/skills"
run = "bash scripts/link.sh"

[tasks.link-adopt]
description = "Like link, but replaces globally installed skill copies with symlinks and releases them from the skill lock"
run = "bash scripts/link.sh --adopt"

[tasks.sync]
description = "Regenerate plugin manifests, marketplace.json, and the README skill list"
run = "node scripts/sync.mjs"

[tasks.sync-check]
description = "Fail if the generated plugin manifests, marketplace, or README are stale"
run = "node scripts/sync.mjs --check"
